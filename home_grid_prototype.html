<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ProduceAIQ Home Grid Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #EAF5EC 0%, #DBEFE1 50%, #CCE8D4 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35), 0 0 0 4px rgba(255,255,255,0.6);
      margin-bottom: 16px;
    }
    .logo svg { width: 56px; height: 56px; }
    .app-name {
      font-size: 22px;
      font-weight: 800;
      color: #047857;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .tagline {
      font-size: 13px;
      color: #3A3D36;
      text-align: center;
      margin-bottom: 32px;
      font-weight: 500;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 360px;
    }
    .module-btn {
      aspect-ratio: 1;
      border-radius: 20px;
      border: none;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1), 0 0 0 1px rgba(255,255,255,0.5) inset;
    }
    .module-btn:active { transform: scale(0.96); }
    .module-btn svg { width: 36px; height: 36px; }
    .module-btn .label {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .module-btn .hint {
      font-size: 10px;
      font-weight: 500;
      text-align: center;
      color: rgba(255,255,255,0.85);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .module-btn:focus-visible .hint { opacity: 1; }

    /* Module colors */
    .scan { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    .guide { background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%); }
    .terms { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
    .settings { background: linear-gradient(135deg, #64748B 0%, #475569 100%); }

    .footer-note {
      margin-top: 32px;
      font-size: 11px;
      color: #6B7280;
      text-align: center;
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <div class="logo" role="img" aria-label="ProduceAIQ logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
      <path d="M8 12l2 2 4-4"/>
      <path d="M12 8v4"/>
    </svg>
  </div>
  <div class="app-name">ProduceAIQ</div>
  <div class="tagline">Tulong sa pagkilala ng kasariwan ng prutas at gulay</div>

  <div class="grid" role="navigation" aria-label="Mga pangunahing module">
    <button class="module-btn scan" data-module="scan" aria-label="Simula - mag-scan ng produce">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        <path d="M12 7v5l3 3"/>
      </svg>
      <span class="label">Simula</span>
      <span class="hint">I-scan ang produce</span>
    </button>

    <button class="module-btn guide" data-module="guide" aria-label="Gabay - paano gumamit">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span class="label">Gabay</span>
      <span class="hint">Paano mag-scan at<br>ibig sabihin ng confidence</span>
    </button>

    <button class="module-btn terms" data-module="terms" aria-label="Tuntunin - terms at limitasyon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span class="label">Tuntunin</span>
      <span class="hint">Terms, limitasyon,<br>at disclaimer</span>
    </button>

    <button class="module-btn settings" data-module="settings" aria-label="Settings - account at theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span class="label">Settings</span>
      <span class="hint">Account, theme,<br>at preferences</span>
    </button>
  </div>

  <p class="footer-note">Prototype — tap buttons to simulate navigation. Colors match scan (green), guide (blue), terms (amber), settings (slate).</p>

  <script>
    document.querySelectorAll('.module-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mod = btn.dataset.module;
        alert(`Navigate to: ${mod.charAt(0).toUpperCase() + mod.slice(1)} module`);
      });
    });
  </script>
</body>
</html>
